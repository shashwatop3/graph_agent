# Every push to master is tested; if everything passes, it goes live on Fly.io (fly.toml). Pull
# requests are tested only. README "Deploying" says how to set FLY_API_TOKEN, once.
name: test and deploy

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # the same pinned FalkorDB and PostgreSQL the tests use locally (docker-compose.yml)
      - name: Start the services
        run: docker compose up -d --wait

      - uses: astral-sh/setup-uv@v6
      - name: Python tests
        run: |
          uv sync --frozen --extra service
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: viewer/console/package-lock.json
      - name: The page
        working-directory: viewer/console
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    concurrency: deploy  # one deploy at a time; a newer push waits for the one before it
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Fly's own builder makes the image from this commit (Dockerfile), never from a laptop
      - run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "no FLY_API_TOKEN secret yet (README): not deployed"; exit 0; fi
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
