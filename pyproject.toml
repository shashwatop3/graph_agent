[project]
name = "graph-agent"
version = "0.1.0"
description = "A domain-agnostic graph layer for coordinating beliefs across LLM agents, with a benchmark game."
authors = [
    { name = "Shashwat Chaturvedi", email = "135721067+shashwatop3@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.7.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose services running (docker compose up -d --wait)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
