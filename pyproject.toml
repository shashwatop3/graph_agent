[project]
name = "graph-agent"
version = "0.1.0"
description = "A domain-agnostic graph layer for coordinating beliefs across LLM agents, with a benchmark game."
authors = [
    { name = "Shashwat Chaturvedi", email = "135721067+shashwatop3@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.7.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
service = [
    "cryptography>=50.0.2",  # hosted: each person's keys are kept encrypted
    "fastapi>=0.143.3",
    "httpx>=0.28.1",  # hosted: signing in with Google
    "mcp>=2.3.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose services running (docker compose up -d --wait)",
]

[tool.ruff]
line-length = 100
# throwaway design drafts, not part of the package
extend-exclude = ["src/graph_agent/packs/ringfire/viewer/drafts"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
exclude = ["src/graph_agent/packs/ringfire/viewer/drafts", "**/node_modules"]
# Strict: no untyped parameters, no Unknown types. falkordb has no type information, so the
# FalkorDB store keeps that boundary explicit (see `DbNode` and `_graph`).
typeCheckingMode = "strict"
