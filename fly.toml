# Fly.io: one always-on machine with a volume (runs live in memory, files on the volume).
# Change `app` to a name of yours; see README "Deploying" for the secrets to set first.
app = "cascade-console"
primary_region = "sin"  # Singapore: the nearest to India (Fly has no Mumbai now)

[build]
  dockerfile = "Dockerfile"

[env]
  WORKSPACE_MCP_URL = "http://127.0.0.1:8000/mcp"

[[mounts]]
  source = "cascade_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"  # a stopped machine would lose the runs in memory
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/me"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
