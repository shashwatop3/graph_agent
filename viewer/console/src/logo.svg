<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Groundwork">
  <!-- beliefs resting on their grounds: the top belief rests on the two below it, and both rest on
       the foundation -->
  <rect width="64" height="64" rx="14" fill="#141b24"/>
  <g stroke="#e4e9ef" stroke-width="4.5" stroke-linecap="round">
    <line x1="19" y1="47" x2="19" y2="35"/>
    <line x1="45" y1="47" x2="45" y2="35"/>
    <line x1="19" y1="35" x2="32" y2="17"/>
    <line x1="45" y1="35" x2="32" y2="17"/>
  </g>
  <rect x="8" y="45" width="48" height="8" rx="4" fill="#8c9bff"/>
  <circle cx="19" cy="35" r="6.5" fill="#e4e9ef"/>
  <circle cx="45" cy="35" r="6.5" fill="#e4e9ef"/>
  <circle cx="32" cy="16" r="8.5" fill="#f2b84b"/>
</svg>
