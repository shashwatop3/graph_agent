<style>
/* Layout: a full-bleed 3D scene (an island ring at night) with a thin HUD over it: title and stats top-left,
   switches top-right, the night numeral top-centre, truth counts bottom-left, turn track along the bottom.
   One deliberate dark world. */
:root {
  --bg: #0b0e14; --hair: rgb(255 255 255 / .09); --hair2: rgb(255 255 255 / .16); --glass: rgb(14 18 27 / .72);
  --ink: #e9e5db; --dim: #8b909d; --faint: #4a5061;
  --ember: #ff8a3d; --flame: #ffc46b; --water: #5ccfe6; --lie: #ff5c9a; --truth: #9ab8ff; --cut: #ff5050; --gold: #e8c37a;
  --f-display: "Instrument Serif", Georgia, serif; --f-ui: "Geist", system-ui, sans-serif; --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
.app { padding: 12px 16px; padding-block: 12px 16px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.caps { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.stage { position: relative; height: clamp(560px, 88vh, 940px); border-radius: 18px; overflow: hidden; border: 1px solid var(--hair);
  background: radial-gradient(120% 90% at 50% 30%, #151c2b 0%, #0b0e14 60%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.tl { top: 18px; left: 20px; display: grid; gap: 12px; }
.tl h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 38px; line-height: .9; }
.tl h1 em { color: var(--flame); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { display: grid; }
.stat .v { font-family: var(--f-display); font-style: italic; font-size: 30px; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.tr { top: 18px; right: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.toggle { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--hair2); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.toggle button { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; color: var(--dim); transition: background .3s, color .3s; white-space: nowrap; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chk { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--dim); padding: 4px 10px; border-radius: 999px; background: var(--glass); }
.chk input { accent-color: var(--lie); }
.tc { top: 16px; left: 50%; transform: translateX(-50%); text-align: center; width: min(420px, 60%); pointer-events: none; }
.numwrap { height: 64px; overflow: hidden; }
.num { display: block; font-family: var(--f-display); font-style: italic; font-size: 64px; line-height: 64px; }
.cap { font-size: 13px; color: var(--dim); line-height: 1.45; text-wrap: balance; margin-top: 2px; }
.bl { left: 20px; bottom: 86px; display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--hair); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.bl .row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
.bl i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; }
.bl b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); margin-left: 4px; }
.track { left: 16px; right: 16px; bottom: 14px; display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--glass); border: 1px solid var(--hair); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tb { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hair2); display: grid; place-items: center; font-size: 12px; flex: none; }
.tb:disabled { opacity: .35; cursor: default; }
.pips { flex: 1; min-width: 0; max-width: calc(var(--n, 40) * 34px); height: 30px; display: flex; gap: 2px; align-items: flex-end; position: relative; }
.pip { flex: 1; min-width: 3px; height: var(--h); border-radius: 2px 2px 0 0; background: var(--hair2); position: relative; }
.pip::after { content: ""; position: absolute; left: 0; top: -4px; height: 2px; width: var(--l); background: var(--lie); border-radius: 1px; }
.pip.past { background: rgb(255 255 255 / .24); } .pip.now { background: var(--flame); }
.spd { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--hair2); flex: none; }
.start { left: 50%; bottom: 84px; transform: translateX(-50%); padding: 9px 20px; border-radius: 999px; border: 1px solid rgb(255 196 107 / .5); background: rgb(255 196 107 / .08); color: var(--flame); font-size: 13.5px; white-space: nowrap; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; transform: translate(-50%, -100%); font-family: var(--f-mono); font-size: 11px; color: var(--dim); white-space: nowrap; padding: 1px 5px; border-radius: 4px; transition: color .3s, background .3s; }
.lab.sel { color: var(--bg); background: var(--gold); }
.lab.liar { color: var(--lie); }
.lab.hot { color: var(--ink); }
.tip { position: absolute; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--glass); border: 1px solid var(--hair2); font-size: 12px; white-space: nowrap; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.tip small { color: var(--dim); font-family: var(--f-mono); }
.dossier { top: 120px; right: 18px; width: min(320px, calc(100% - 36px)); max-height: calc(100% - 220px); overflow: auto; padding: 16px; border-radius: 14px; background: rgb(14 18 27 / .84); border: 1px solid var(--hair2); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); display: grid; gap: 14px; }
.d-h { display: flex; align-items: baseline; gap: 10px; }
.d-h .nm { font-family: var(--f-display); font-size: 36px; line-height: .9; }
.d-h .x { margin-left: auto; color: var(--dim); font-size: 18px; width: 28px; height: 28px; border-radius: 50%; }
.d-sec { display: grid; gap: 6px; }
.msg { font-size: 13px; line-height: 1.45; padding-left: 10px; border-left: 1px solid var(--hair2); }
.msg.lie { border-left-color: var(--lie); }
.msg small { display: block; font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); }
.thought { font-family: var(--f-display); font-style: italic; font-size: 18px; line-height: 1.35; }
.caret { display: inline-block; width: 1px; height: 1em; background: var(--flame); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.blist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.blist li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.blist li.dead > span:first-child { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--cut); }
.st { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.none { color: var(--dim); font-size: 12.5px; margin: 0; }
details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
details > div { display: grid; gap: 6px; margin-top: 6px; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dim); }
.foot { font-size: 11.5px; color: var(--faint); margin: 10px 4px 0; }
@media (max-width: 760px) {
  .tc { top: 120px; } .tl h1 { font-size: 28px; } .stats { gap: 14px; } .stat .v { font-size: 22px; }
  .bl { display: none; } .dossier { top: auto; bottom: 76px; left: 12px; right: 12px; width: auto; max-height: 50%; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="3D island: a ring of fields, a watchtower for each agent, messages flying between towers"></canvas>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="tip" id="tip" hidden></div>

    <div class="hud tl"><div><span class="caps" id="tag"></span><h1>Ring Fire <em>Isle</em></h1></div><div class="stats" id="stats"></div></div>
    <div class="hud tr">
      <div class="toggle" role="group" aria-label="Agent memory"><button id="m-graph" aria-pressed="true">Graph mind</button><button id="m-prompt" aria-pressed="false">Prompt mind</button></div>
      <div class="toggle" role="group" aria-label="Island size"><button id="d-real" aria-pressed="true">16 keepers</button><button id="d-scale" aria-pressed="false">64 keepers</button></div>
      <label class="chk"><input type="checkbox" id="reveal"> Reveal liars</label>
    </div>
    <div class="hud tc"><span class="caps">Night</span><div class="numwrap"><span class="num" id="num">1</span></div><div class="cap" id="cap"></div></div>
    <div class="hud bl"><span class="caps">Truth on the island</span><div class="row" id="wcount"></div><span class="caps" style="letter-spacing:.08em;text-transform:none">Drag to orbit · scroll to zoom · hover a field</span></div>
    <button class="hud start" id="start">Play the night ▸</button>
    <div class="hud track" aria-label="Turn track">
      <button class="tb" id="prev" aria-label="Previous night">◂</button>
      <button class="tb" id="play" aria-label="Play">▶</button>
      <button class="tb" id="next" aria-label="Next night">▸</button>
      <div class="pips" id="pips"></div>
      <button class="spd" id="speed">1×</button>
    </div>
    <div class="hud dossier" id="dossier" hidden></div>
  </div>
  <p class="foot" id="foot"></p>
</div>

  const arr = P.geometry.attributes.position.array, u = P.userData;
  for (let k = 0; k < u.life.length; k++) {
    if (u.life[k] <= 0) {
      if (!burning.length || REDUCED || Math.random() > 0.08) { arr[k * 3 + 1] = -50; continue; }
      const m = burning[(Math.random() * burning.length) | 0], c = m.userData.center || (m.userData.center = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()));
      arr[k * 3] = c.x + (Math.random() - .5) * 1.2; arr[k * 3 + 1] = 0.5; arr[k * 3 + 2] = c.z + (Math.random() - .5) * 1.2; u.life[k] = 1;
    }
    u.life[k] -= dt * (0.45 + u.seed[k] * 0.4);
    arr[k * 3 + 1] += dt * (1.2 + u.seed[k] * 1.6);
    arr[k * 3] += Math.sin(clock.elapsedTime * 2 + k) * dt * 0.3;
  }
  P.geometry.attributes.position.needsUpdate = true;
}

// ================= labels, hover, click =================
let labelEls = [];
function buildLabels() {
  const box = $("#labels"); box.innerHTML = "";
  labelEls = W.towers.map((_, i) => { const d = document.createElement("div"); d.className = "lab"; d.textContent = A(i); box.appendChild(d); return d; });
}
function updateLabels() {
  const r = $("#stage").getBoundingClientRect(), v = new THREE.Vector3(), turns = run().turns;
  W.towers.forEach((t, i) => {
    const el = labelEls[i]; if (!el) return;
    const id = A(i), liar = S.reveal && ds().imp.has(i), show = small() || i % 4 === 0 || S.open === id || liar || hoverAgent === i;
    v.copy(towerTop(i)); v.y += 0.6; v.project(camera);
    const vis = show && v.z < 1;
    el.style.display = vis ? "" : "none"; if (!vis) return;
    el.style.left = ((v.x + 1) / 2 * r.width) + "px"; el.style.top = ((1 - v.y) / 2 * r.height) + "px";
    el.className = "lab" + (S.open === id ? " sel" : liar ? " liar" : t.lit || hoverAgent === i ? " hot" : "");
  });
}
let hoverAgent = -1;
function pointer() {
  const cv = $("#gl"), ray = new THREE.Raycaster(), p = new THREE.Vector2(), tip = $("#tip");
  let down = null;
  const pick = e => {
    const r = cv.getBoundingClientRect(); p.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(p, camera);
    const hitT = ray.intersectObjects(W.towers.map(t => t.hit), false)[0];
    if (hitT) return { agent: hitT.object.userData.agent };
    const hitF = ray.intersectObjects(W.tiles, false)[0];
    return hitF ? { field: hitF.object.userData.field, owner: hitF.object.userData.owner, state: hitF.object.userData.state } : null;
  };
  cv.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
  cv.addEventListener("pointermove", e => {
    const h = pick(e), r = $("#stage").getBoundingClientRect();
    hoverAgent = h && h.agent !== undefined ? h.agent : -1;
    cv.style.cursor = hoverAgent >= 0 ? "pointer" : "grab";
    if (h && h.field !== undefined) {
      tip.hidden = false; tip.innerHTML = `F${h.field} <small>· keeper ${A(h.owner)} · ${{ alive: "alive", burning: "on fire", burnt: "burnt", saved: "saved by water" }[h.state]}</small>`;
      tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 220) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px";
    } else if (hoverAgent >= 0) {
      tip.hidden = false; tip.innerHTML = `${A(hoverAgent)} <small>· keeper of F${hoverAgent * ds().fpa}–F${hoverAgent * ds().fpa + ds().fpa - 1} · click</small>`;
      tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 220) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px";
    } else tip.hidden = true;
  });
  cv.addEventListener("pointerleave", () => { tip.hidden = true; hoverAgent = -1; });
  cv.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const h = pick(e);
    if (h && h.agent !== undefined) openDossier(A(h.agent));
    else if (h && h.field !== undefined) openDossier(A(h.owner));
    else if (S.open) closeDossier();
  });
}

// ================= dossier =================
function focusOn(i) {
  if (!AN) return;
  const p = towerTop(i), dir = new THREE.Vector3(p.x, 0, p.z).normalize();
  const camTo = p.clone().add(dir.multiplyScalar(small() ? 13 : 12)); camTo.y = small() ? 11 : 10;
  controls.autoRotate = false;
  AN({ targets: controls.target, x: p.x * 0.45, y: 0.5, z: p.z * 0.45, duration: 1300, easing: "easeInOutCubic" });
  AN({ targets: camera.position, x: camTo.x, y: camTo.y, z: camTo.z, duration: 1300, easing: "easeInOutCubic" });
}
function openDossier(id) { S.open = id; applyTowers(S.day); setTrails(S.day); renderDossier(true); focusOn(num(id)); }
function closeDossier() { S.open = null; applyTowers(S.day); setTrails(S.day); const b = $("#dossier");
  if (AN) AN({ targets: b, opacity: [1, 0], translateY: [0, 8], duration: 260, easing: "easeInQuad", complete: () => b.hidden = true }); else b.hidden = true;
  if (AN) { AN({ targets: controls.target, x: 0, y: 0, z: 0, duration: 1200, easing: "easeInOutCubic" }); } }
function msgLine(m, dir) {
  const lie = m[6] && S.reveal, other = dir === "out" ? A(m[2]) : A(m[1]);
  return `<div class="msg ${lie ? "lie" : ""}">${dir === "out" ? "to " + other : other}: fire reaches F${m[4]} on day ${m[5]}${lie ? ' <span class="st" style="--c:var(--lie)">lie</span>' : ""}<small>${m[3].map(A).join(" → ")}</small></div>`;
}
function capped(list, f, k = 3) {
  if (!list.length) return '<p class="none">Nothing.</p>';
  return list.slice(0, k).map(f).join("") + (list.length > k ? `<details><summary>${list.length - k} more</summary><div>${list.slice(k).map(f).join("")}</div></details>` : "");
}
function renderDossier(fresh) {
  const id = S.open; if (!id) return;
  const i = num(id), d = S.day, fpa = ds().fpa, box = $("#dossier");
  const ms = run().msgs.filter(m => m[0] === d), heard = ms.filter(m => A(m[2]) === id), said = ms.filter(m => A(m[1]) === id);
  const t = run().turns[`${id}|${d}`], cuts = [...new Set(cutsUpTo(d).filter(e => e[1] === id).map(e => e[2]))];
  let h = `<div class="d-h"><span class="nm">${id}</span><span class="caps">keeper of F${i * fpa}${fpa > 2 ? "–" : ", "}F${i * fpa + fpa - 1}${S.reveal && ds().imp.has(i) ? ' · <span style="color:var(--lie)">liar</span>' : ""}</span><button class="x" id="x" aria-label="Close">×</button></div>`;
  h += `<div class="d-sec"><span class="caps">Thinks · night ${d}</span><div class="thought" id="thought">${t ? "" : '<span class="none" style="font-family:var(--f-ui);font-style:normal">Silent tonight.</span>'}</div></div>`;
  h += `<div class="d-sec"><span class="caps">Heard</span>${capped(heard, m => msgLine(m, "in"))}</div>`;
  h += `<div class="d-sec"><span class="caps">Said</span>${capped(said, m => msgLine(m, "out"))}</div>`;
  if (S.mem === "graph") {
    let rows = [];
    if (ds().beliefs) rows = (ds().beliefs[id] || []).filter(b => b[3] <= d).map(b => { const dead = b[4] !== null && b[4] <= d; return [dead, `F${b[1]} burns day ${b[2]}`, dead ? ["dropped", "var(--cut)"] : b[5] === "forecast" ? ["forecast", "var(--dim)"] : ["holds", "var(--truth)"], b[6] ? `via ${b[6]}` : b[5]]; });
    else {
      const cut = new Set(cutsUpTo(d).filter(e => e[1] === id).map(e => num(e[2]))), by = new Map();
      run().msgs.filter(m => m[0] <= d && A(m[2]) === id).forEach(m => { const k = m[4] + "|" + m[5], b = by.get(k) || { f: m[4], c: m[5], r: [] }; b.r.push(m[3]); by.set(k, b); });
      rows = [...by.values()].map(b => { const live = b.r.filter(r => !r.some(x => cut.has(x))).length; return [!live, `F${b.f} burns day ${b.c}`, live ? ["holds", "var(--truth)"] : ["dropped", "var(--cut)"], `${live}/${b.r.length} routes`]; }).sort((a, b) => b[0] - a[0]);
    }
    const row = r => `<li class="${r[0] ? "dead" : ""}"><span>${r[1]} <small style="color:var(--dim)">${r[3]}</small></span><span class="st" style="--c:${r[2][1]}">${r[2][0]}</span></li>`;
    h += `<div class="d-sec"><span class="caps">Memory graph</span>${rows.length ? `<ul class="blist">${rows.slice(0, 5).map(row).join("")}</ul>${rows.length > 5 ? `<details><summary>${rows.length - 5} more</summary><div><ul class="blist">${rows.slice(5).map(row).join("")}</ul></div></details>` : ""}` : '<p class="none">Empty so far.</p>'}</div>`;
    if (cuts.length) h += `<div class="d-sec"><span class="caps">Distrusts</span><p class="none" style="color:var(--cut)">${cuts.join(", ")}, caught lying by the evidence.</p></div>`;
  } else h += `<div class="d-sec"><span class="caps">Memory</span><p class="none">No memory graph. A prompt mind re-reads the whole chat log every night and keeps nothing structured.</p></div>`;
  const wasHidden = box.hidden;
  box.innerHTML = h; box.hidden = false; $("#x").onclick = closeDossier;
  if (t) {
    const text = `“${t.final || "…"}”`, el_ = $("#thought");
    if (AN && fresh) { const o = { n: 0 }; el_.innerHTML = '<span></span><i class="caret"></i>'; const sp = el_.firstChild;
      AN({ targets: o, n: text.length, duration: Math.min(2400, text.length * 16), easing: "linear", update: () => sp.textContent = text.slice(0, o.n | 0) }); }
    else el_.textContent = text;
  }
  if (AN && wasHidden) AN({ targets: box, opacity: [0, 1], translateY: [10, 0], duration: 420, easing: "easeOutQuart" });
}

// ================= track + controls =================
function buildTrack() {
  const D = ds().D, r = run(), mx = Math.max(1, ...Array.from({ length: D }, (_, d) => r.msgs.filter(m => m[0] === d).length));
  $("#pips").style.setProperty("--n", D);
  $("#pips").innerHTML = Array.from({ length: D }, (_, d) => { const ms = r.msgs.filter(m => m[0] === d), l = ms.filter(m => m[6]).length;
    return `<button class="pip" data-d="${d}" aria-label="Night ${d}" style="--h:${22 + 78 * ms.length / mx}%;--l:${ms.length ? l / ms.length * 100 : 0}%"></button>`; }).join("");
  document.querySelectorAll(".pip").forEach(p => p.onclick = () => { stop(); go(+p.dataset.d); });
}
function applyTrack() {
  document.querySelectorAll(".pip").forEach((p, d) => { p.classList.toggle("past", d < S.day); p.classList.toggle("now", d === S.day); });
  $("#prev").disabled = S.day === 0; $("#next").disabled = S.day >= ds().D - 1;
}
function go(d) { S.token++; S.day = Math.max(0, Math.min(ds().D - 1, d)); settle(S.day); }
function stop() { if (!S.playing) return; S.playing = false; S.token++; $("#play").textContent = "▶"; $("#start").hidden = false; settle(S.day); }
async function play(fromStart) {
  if (S.playing) return stop();
  S.playing = true; $("#play").textContent = "❚❚"; $("#start").hidden = true; controls.autoRotate = !REDUCED;
  let d = fromStart || S.day >= ds().D - 1 ? 0 : S.day + 1;
  if (fromStart) { S.token++; applyLinks(-1); applyWorld(-1, false); applyStats(-1, false); }
  while (S.playing && d < ds().D) { const tok = ++S.token; await playNight(d, tok); if (tok !== S.token) return; d++; }
  S.playing = false; $("#play").textContent = "▶"; $("#start").hidden = false;
}
$("#play").onclick = () => play(false);
$("#start").onclick = () => play(true);
$("#prev").onclick = () => { stop(); go(S.day - 1); };
$("#next").onclick = async () => { if (S.playing) stop(); if (S.day < ds().D - 1) { const tok = ++S.token; await playNight(S.day + 1, tok); if (tok === S.token) settle(S.day); } };
$("#speed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $("#speed").textContent = S.speed + "×"; };
const press = (a, b, v) => { $(a).setAttribute("aria-pressed", v); $(b).setAttribute("aria-pressed", !v); };
$("#m-graph").onclick = () => { stop(); press("#m-graph", "#m-prompt", true); S.mem = "graph"; buildTrack(); go(S.day); };
$("#m-prompt").onclick = () => { stop(); press("#m-graph", "#m-prompt", false); S.mem = "prompt"; buildTrack(); go(S.day); };
$("#reveal").onchange = e => { S.reveal = e.target.checked; applyTowers(S.day); if (S.open) renderDossier(false); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape" && S.open) closeDossier();
  if (e.key === "ArrowRight") { stop(); go(S.day + 1); } if (e.key === "ArrowLeft") { stop(); go(S.day - 1); }
});
function setSet(k) {
  stop(); S.set = k; press("#d-real", "#d-scale", k === "real"); S.open = null; $("#dossier").hidden = true;
  $("#tag").textContent = k === "real" ? "16 keepers · 5 liars · real run" : "64 keepers · 9 liars · stand-in data";
  $("#foot").textContent = k === "real" ? "Every message, thought and belief comes from the run logs: runs/hard16, seed 0, graph-memory and B3o prompt-only." : "64 keepers is a seeded stand-in simulation with the game's rules, not a model run.";
  $("#stats").innerHTML = [["lies", "Lies passed on", "var(--lie)"], ["cuts", "Trust cuts", "var(--cut)"], ["lost", "Fields burnt", "var(--ember)"], ["saved", "Saved", "var(--water)"]]
    .map(([key, l, c]) => `<div class="stat" style="--c:${c}"><span class="v" id="s-${key}">0</span><span class="caps">${l}</span></div>`).join("");
  S.shown = {};
  buildWorld(); buildLabels(); buildTrack();
  if (AN && camera) AN({ targets: controls.target, x: 0, y: 0, z: 0, duration: 800, easing: "easeInOutCubic" });
  go(k === "real" ? 1 : 9);
}
$("#d-real").onclick = () => setSet("real");
$("#d-scale").onclick = () => setSet("scale");

if (HAS3D) { initGL(); setSet("real"); }
else { $("#stage").insertAdjacentHTML("beforeend", '<div class="fallback"><p>This view needs WebGL, which this browser or frame did not provide.<br>The 2D night map shows the same replay.</p></div>'); }
</script>
