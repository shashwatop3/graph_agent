<title>Ring Fire Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
/* Layout: a game screen. HUD across the top, the night map of beacons in the middle, the truth minimap and
   dispatch log on the right, a turn track along the bottom. One deliberate dark world (no light theme). */
:root {
  --night: #0a0f1d; --terrain: #10182c; --panel: #131c33; --edge: #26324f; --dim: #8791ab; --ink: #ece6d6;
  --ember: #ff7a2f; --flame: #ffb347; --char: #3d2f2b; --grass: #1c3a2c; --water: #39c6ff;
  --lie: #ff4fa3; --truth: #86b4ff; --cut: #ff3b3b; --gold: #f2c14e;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14px; background:
  radial-gradient(1200px 700px at 40% 45%, #16213d 0%, var(--night) 70%) fixed; }
.wrap { padding: 16px; padding-block: 14px 24px; display: grid; gap: 12px; max-width: 1440px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo b { font-family: var(--f-display); font-weight: 900; font-size: 34px; letter-spacing: .04em; line-height: 1; text-transform: uppercase;
  background: linear-gradient(180deg, var(--flame), var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo span { font-family: var(--f-mono); font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
.gauges { display: flex; gap: 8px; flex-wrap: wrap; }
.gauge { background: linear-gradient(180deg, #172242, #111a33); border: 1px solid var(--edge); border-radius: 10px; padding: 5px 12px 6px; min-width: 92px; position: relative; overflow: hidden; }
.gauge .v { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--c, var(--ink)); font-variant-numeric: tabular-nums; }
.gauge .k { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.gauge::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c, var(--edge)); opacity: .8; }
.switches { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 10px; padding: 3px; background: #0e1529; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 12px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--night); font-weight: 600; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }
.frame { background: linear-gradient(180deg, rgb(19 28 51 / .9), rgb(13 20 38 / .9)); border: 1px solid var(--edge); border-radius: 16px; min-width: 0; position: relative; }
.frame-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px 0; flex-wrap: wrap; }
.frame-h h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.frame-h small { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }

.stage { position: relative; aspect-ratio: 1 / 1; max-height: 78vh; margin: 0 auto; width: 100%; max-width: 100%; }
.stage canvas, .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
svg text { font-family: var(--f-mono); }
.beacon { cursor: pointer; }
.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.banner .big { font-family: var(--f-display); font-weight: 900; font-size: clamp(54px, 9vw, 110px); line-height: .9; letter-spacing: .03em; color: var(--ink); text-shadow: 0 0 30px rgb(255 122 47 / .45); }
.banner .sub { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--flame); margin-top: 6px; max-width: 28ch; margin-inline: auto; }
.startbtn { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); border: 1px solid var(--flame); background: rgb(255 122 47 / .14); color: var(--flame);
  font-family: var(--f-display); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 18px; padding: 8px 22px; border-radius: 999px; }
.startbtn:hover { background: rgb(255 122 47 / .25); }

/* dossier */
.dossier { position: absolute; top: 12px; right: 12px; width: min(340px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; z-index: 6;
  background: linear-gradient(180deg, #18233f, #111a31); border: 1px solid var(--edge); border-radius: 14px; padding: 14px; display: grid; gap: 12px;
  box-shadow: 0 20px 50px -10px rgb(0 0 0 / .6), inset 0 1px 0 rgb(255 255 255 / .04); }
.dos-h { display: grid; grid-template-columns: 54px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.sigil { width: 54px; height: 54px; }
.dos-h .name { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: .9; letter-spacing: .03em; }
.dos-h .role { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.close { border: 1px solid var(--edge); background: transparent; width: 30px; height: 30px; border-radius: 50%; color: var(--dim); }
.sec { display: grid; gap: 6px; }
.sec > .t { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.line { border-radius: 10px; padding: 7px 10px; background: rgb(255 255 255 / .04); border: 1px solid var(--edge); font-size: 13px; line-height: 1.4; }
.line.out { border-color: rgb(134 180 255 / .45); }
.line.false { border-color: var(--lie); box-shadow: 0 0 0 1px rgb(255 79 163 / .25), 0 0 18px -6px var(--lie); }
.line small { display: block; font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); margin-top: 2px; }
.speech { font-size: 13.5px; line-height: 1.55; font-style: italic; padding: 10px 12px; border-radius: 12px; background: #0d1427; border: 1px solid var(--edge); position: relative; min-height: 2.6em; }
.speech::before { content: ""; position: absolute; left: 18px; top: -7px; width: 12px; height: 12px; background: #0d1427; border-left: 1px solid var(--edge); border-top: 1px solid var(--edge); transform: rotate(45deg); }
.chip { font-family: var(--f-mono); font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--c, var(--edge)); color: var(--c, var(--dim)); white-space: nowrap; }
.bl { list-style: none; padding: 0; margin: 0; display: grid; gap: 5px; }
.bl li { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.bl li.dead > span:first-child { text-decoration: line-through; color: var(--dim); }
.none { color: var(--dim); font-size: 12.5px; margin: 0; }
details summary { cursor: pointer; font-size: 12px; color: var(--dim); }
details > div { margin-top: 6px; display: grid; gap: 6px; }
@media (max-width: 640px) { .dossier { position: fixed; top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 72vh; } }

/* truth minimap */
.side { display: grid; gap: 12px; }
.pad { padding: 10px 14px 14px; }
.wstats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.ws { border-radius: 8px; padding: 5px 8px; background: #0e1529; border: 1px solid var(--edge); min-width: 0; }
.ws .v { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.05; color: var(--c); font-variant-numeric: tabular-nums; }
.ws .k { font-family: var(--f-mono); font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 5px; margin-top: 10px; }
.tile { border-radius: 7px; padding: 5px 7px; background: var(--grass); border: 1px solid rgb(255 255 255 / .05); display: grid; gap: 1px; min-width: 0; position: relative; }
.tile b { font-family: var(--f-mono); font-size: 12px; }
.tile .own { font-family: var(--f-mono); font-size: 10px; color: rgb(236 230 214 / .65); }
.tile.burning { background: linear-gradient(180deg, var(--flame), var(--ember)); color: #2a1206; box-shadow: 0 0 16px -4px var(--ember); }
.tile.burning .own { color: rgb(42 18 6 / .75); }
.tile.burnt { background: var(--char); color: #b8a69d; }
.tile.saved { box-shadow: inset 0 0 0 2px var(--water), 0 0 14px -6px var(--water); }
.tile.watered::after { content: "≈"; position: absolute; top: 2px; right: 6px; color: var(--water); font-weight: 700; }
.tile.mine { outline: 2px solid var(--gold); outline-offset: 1px; }
.blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; margin-top: 10px; }
.blk { border: 0; padding: 3px; border-radius: 6px; background: #0e1529; display: grid; gap: 2px; }
.blk .cells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
.blk .c { aspect-ratio: 1; border-radius: 2px; background: var(--grass); }
.blk .c.burning { background: var(--ember); box-shadow: 0 0 8px -1px var(--ember); } .blk .c.burnt { background: var(--char); } .blk .c.saved { background: var(--water); }
.blk .t { font-family: var(--f-mono); font-size: 9px; color: var(--dim); text-align: center; }
.blk.mine { outline: 2px solid var(--gold); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 230px; overflow: auto; font-family: var(--f-mono); font-size: 11.5px; }
.log li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--edge); }
.log .k { font-weight: 600; color: var(--c); letter-spacing: .04em; }

/* turn track */
.track { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: rgb(14 21 41 / .9); border: 1px solid var(--edge); border-radius: 14px; padding: 10px 12px; }
.tbtn { height: 36px; min-width: 40px; border-radius: 10px; border: 1px solid var(--edge); background: #172242; font-size: 14px; padding: 0 12px; }
.tbtn.primary { border-color: var(--flame); color: var(--flame); }
.pips { display: flex; gap: 3px; flex: 1 1 300px; min-width: 0; align-items: flex-end; height: 34px; }
.pip { flex: 1; min-width: 4px; border: 0; padding: 0; border-radius: 3px 3px 1px 1px; background: var(--edge); position: relative; }
.pip.past { background: #3a4a72; }
.pip.now { background: var(--flame); box-shadow: 0 0 12px var(--ember); }
.pip .lie { position: absolute; left: 0; right: 0; bottom: 0; background: var(--lie); border-radius: 0 0 1px 1px; opacity: .85; }
.daytxt { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .05em; min-width: 6.5ch; }
.speed { font-family: var(--f-mono); font-size: 12px; }
.foot { font-size: 11.5px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header class="hud">
    <div class="logo"><b>Ring Fire</b><span id="tagline"></span></div>
    <div class="gauges" id="gauges"></div>
    <div class="switches">
      <div class="seg" role="group" aria-label="Agent memory"><button id="m-graph" aria-pressed="true">Graph mind</button><button id="m-prompt" aria-pressed="false">Prompt mind</button></div>
      <div class="seg" role="group" aria-label="Map"><button id="d-real" aria-pressed="true">16 keepers</button><button id="d-scale" aria-pressed="false">64 keepers</button></div>
      <label class="chk"><input type="checkbox" id="reveal"> Reveal liars</label>
    </div>
  </header>

  <div class="main">
    <section class="frame" aria-label="Night map">
      <div class="frame-h"><h2>The ring at night</h2><small id="stage-hint">click a beacon to open its dossier</small></div>
      <div class="stage" id="stage">
        <canvas id="embers" aria-hidden="true"></canvas>
        <svg id="map" viewBox="0 0 640 640" role="img" aria-label="Agents as beacons and the messages between them"></svg>
        <div class="banner" id="banner"><div class="big" id="b-big"></div><div class="sub" id="b-sub"></div></div>
        <button class="startbtn" id="start">▶ Play the night</button>
        <div class="dossier" id="dossier" hidden></div>
      </div>
    </section>

    <aside class="side">
      <section class="frame">
        <div class="frame-h"><h2>Truth map</h2><small>what really happened · agents can't see this</small></div>
        <div class="pad"><div class="wstats" id="wstats"></div><div id="world"></div></div>
      </section>
      <section class="frame">
        <div class="frame-h"><h2>Dispatch</h2><small id="log-day"></small></div>
        <div class="pad"><ul class="log" id="log"></ul></div>
      </section>
    </aside>
  </div>

  <section class="track" aria-label="Turn track">
    <button class="tbtn" id="prev" aria-label="Previous day">◂</button>
    <button class="tbtn primary" id="play" aria-label="Play">▶</button>
    <button class="tbtn" id="next" aria-label="Next day">▸</button>
    <span class="daytxt" id="daytxt"></span>
    <div class="pips" id="pips"></div>
    <button class="tbtn speed" id="speed">1×</button>
  </section>
  <p class="foot" id="foot"></p>
</div>

// ================= animation of one day =================
async function animateDay(d, token) {

  // pre-state: yesterday's cuts and world, no trails

  $("#log").innerHTML = ""; $("#log-day").textContent = `day ${d}`;
  await banner(`Day ${d}`, caption(d), sp); if (!alive()) return;
  // couriers
  const msgs = run().msgs.filter(m => m[0] === d);
  const gap = (big() ? 260 : 70) / sp, flights = [];
  msgs.forEach((m, k) => flights.push(sleep(k * gap).then(() => alive() && courier(m, k, sp))));
  await Promise.all(flights); if (!alive()) return;
  drawNodes(d); drawTrails(d);
  // the world turns: fire, water
  drawWorld(d, true); await sleep(500 / sp); if (!alive()) return;
  // trust cuts snap
  const cuts = run().expo.filter(e => e[0] === d);
  for (const [k, e] of cuts.entries()) { if (!alive()) return; snap(e); logLine("CUT", "var(--cut)", `${e[1]} stops trusting ${e[2]}`); if (k < 8) await sleep(260 / sp); }

}

function openDossier(id) { S.open = id; drawNodes(S.day); drawTrails(S.day); drawWorld(S.day); renderDossier(true); }
function closeDossier() { S.open = null; $("#dossier").hidden = true; drawNodes(S.day); drawTrails(S.day); drawWorld(S.day); }
function sigil(id) {
  const i = num(id), liar = S.reveal && ds().imp.has(i), pts = [];
  for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 - Math.PI / 2; pts.push(`${27 + 24 * Math.cos(a)},${27 + 24 * Math.sin(a)}`); }
  return `<svg class="sigil" viewBox="0 0 54 54" aria-hidden="true"><polygon points="${pts.join(" ")}" fill="#0e1529" stroke="${liar ? "var(--lie)" : "var(--gold)"}" stroke-width="2"/><text x="27" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="${liar ? "var(--lie)" : "var(--gold)"}">${id}</text></svg>`;
}
function line(m, dir) {
  const lie = m[6] && S.reveal, other = dir === "out" ? A(m[2]) : A(m[1]);
  return `<div class="line ${dir} ${lie ? "false" : ""}">${dir === "out" ? "→ " + other : other + " says"}: fire reaches <b>F${m[4]}</b> on day <b>${m[5]}</b>${lie ? ' <span class="chip" style="--c:var(--lie)">lie</span>' : ""}<small>route ${m[3].map(A).join(" → ")}</small></div>`;
}
function capped(list, f, k = 3) {
  if (!list.length) return '<p class="none">Nothing.</p>';
  return list.slice(0, k).map(f).join("") + (list.length > k ? `<details><summary>${list.length - k} more</summary><div>${list.slice(k).map(f).join("")}</div></details>` : "");
}
function renderDossier(fresh) {
  const id = S.open; if (!id) return;
  const i = num(id), d = S.day, fpa = ds().fpa, box = $("#dossier");
  const ms = run().msgs.filter(m => m[0] === d), heard = ms.filter(m => A(m[2]) === id), said = ms.filter(m => A(m[1]) === id);
  const t = run().turns[`${id}|${d}`], cuts = [...new Set(cutsUpTo(d).filter(e => e[1] === id).map(e => e[2]))];
  let h = `<div class="dos-h">${sigil(id)}<div><div class="name">${id}</div><div class="role">keeper of F${i * fpa}${fpa > 2 ? "–" : ", "}F${i * fpa + fpa - 1}${S.reveal && ds().imp.has(i) ? " · <span style=\"color:var(--lie)\">liar</span>" : ""}</div></div><button class="close" id="close" aria-label="Close">✕</button></div>`;
  h += `<div class="sec"><span class="t">Heard · day ${d}</span>${capped(heard, m => line(m, "in"))}</div>`;
  h += `<div class="sec"><span class="t">Thinks</span><div class="speech" id="speech">${t ? "" : '<span class="none">Silent today.</span>'}</div></div>`;
  h += `<div class="sec"><span class="t">Says</span>${capped(said, m => line(m, "out"))}</div>`;
  if (S.mem === "graph") {
    if (ds().beliefs) {
      const bel = (ds().beliefs[id] || []).filter(b => b[3] <= d);
      h += `<div class="sec"><span class="t">Memory graph</span>${bel.length ? `<ul class="bl">${bel.map(b => { const dead = b[4] !== null && b[4] <= d;
        return `<li class="${dead ? "dead" : ""}"><span>F${b[1]} burns day ${b[2]} <small style="color:var(--dim)">${b[5]}${b[6] ? " via " + b[6] : ""}</small></span><span class="chip" style="--c:${dead ? "var(--cut)" : b[5] === "forecast" ? "var(--dim)" : "var(--truth)"}">${dead ? "dropped" : b[5] === "forecast" ? "forecast" : "holds"}</span></li>`; }).join("")}</ul>` : '<p class="none">Empty so far.</p>'}</div>`;
    } else {
      const cut = new Set(cutsUpTo(d).filter(e => e[1] === id).map(e => num(e[2]))), by = new Map();
      run().msgs.filter(m => m[0] <= d && A(m[2]) === id).forEach(m => { const k = m[4] + "|" + m[5], b = by.get(k) || { f: m[4], c: m[5], r: [] }; b.r.push(m[3]); by.set(k, b); });
      const bel = [...by.values()].map(b => ({ ...b, live: b.r.filter(r => !r.some(x => cut.has(x))).length })).sort((a, b) => (a.live > 0) - (b.live > 0));
      const row = b => `<li class="${b.live ? "" : "dead"}"><span>F${b.f} burns day ${b.c} <small style="color:var(--dim)">${b.live}/${b.r.length} routes</small></span><span class="chip" style="--c:${b.live ? "var(--truth)" : "var(--cut)"}">${b.live ? "holds" : "dropped"}</span></li>`;
      h += `<div class="sec"><span class="t">Memory graph · ${bel.length}</span>${bel.length ? `<ul class="bl">${bel.slice(0, 5).map(row).join("")}</ul>` + (bel.length > 5 ? `<details><summary>${bel.length - 5} more</summary><div><ul class="bl">${bel.slice(5).map(row).join("")}</ul></div></details>` : "") : '<p class="none">Empty so far.</p>'}</div>`;
    }
    if (cuts.length) h += `<div class="sec"><span class="t">Distrusts</span><p class="none" style="color:var(--cut)">${cuts.join(", ")}: caught lying by the evidence.</p></div>`;
  } else h += `<div class="sec"><span class="t">Memory</span><p class="none">No memory graph. A prompt mind re-reads the whole chat log every turn and keeps nothing structured.</p></div>`;
  box.innerHTML = h; const wasHidden = box.hidden; box.hidden = false;
  $("#close").onclick = closeDossier;
  if (t) {
    const text = `“${t.final || "…"}”`, sp = $("#speech");
    if (AN && fresh) { const o = { n: 0 }; AN({ targets: o, n: text.length, duration: Math.min(2200, text.length * 18), easing: "linear", update: () => sp.textContent = text.slice(0, o.n | 0) }); }
    else sp.textContent = text;
  }
  if (AN && wasHidden) AN({ targets: box, translateX: [40, 0], opacity: [0, 1], duration: 420, easing: "easeOutCubic" });
}

// ================= turn track =================
function drawTrack() {
  const D = ds().D, r = run(), mx = Math.max(1, ...Array.from({ length: D }, (_, d) => r.msgs.filter(m => m[0] === d).length));
  $("#pips").innerHTML = Array.from({ length: D }, (_, d) => {
    const ms = r.msgs.filter(m => m[0] === d), h = 30 + 70 * ms.length / mx, lies = ms.filter(m => m[6]).length;
    return `<button class="pip ${d < S.day ? "past" : ""} ${d === S.day ? "now" : ""}" data-d="${d}" style="height:${h}%" aria-label="Day ${d}"><span class="lie" style="height:${ms.length ? lies / ms.length * 100 : 0}%"></span></button>`;
  }).join("");
  document.querySelectorAll(".pip").forEach(p => p.onclick = () => { stop(); goto(+p.dataset.d); });
  $("#daytxt").textContent = `Day ${S.day}`;
  $("#prev").disabled = S.day === 0; $("#next").disabled = S.day >= D - 1;
}

// ================= control flow =================
function goto(d) { S.token++; S.day = Math.max(0, Math.min(ds().D - 1, d)); L.fx.innerHTML = ""; $("#banner").style.opacity = .1; $("#b-big").textContent = `Day ${S.day}`; $("#b-sub").textContent = caption(S.day); settle(S.day); if (S.open) renderDossier(false); }
async function stepTo(d) {
  const token = ++S.token; S.day = d; drawTrack();
  await animateDay(d, token);
  if (token === S.token) settle(d);
}
function stop() { S.playing = false; S.token++; $("#play").textContent = "▶"; $("#start").hidden = false; }
async function play() {
  if (S.playing) return stop();
  S.playing = true; $("#play").textContent = "❚❚"; $("#start").hidden = true;
  if (S.day >= ds().D - 1) S.day = -1;
  while (S.playing && S.day < ds().D - 1) { await stepTo(S.day + 1); if (S.playing) await sleep(250 / S.speed); }
  if (S.playing) stop();
}
$("#play").onclick = play;
$("#start").onclick = () => { S.day = -1; play(); };
$("#prev").onclick = () => { stop(); goto(S.day - 1); };
$("#next").onclick = () => { if (S.playing) stop(); stepTo(Math.min(ds().D - 1, S.day + 1)); };
$("#speed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $("#speed").textContent = S.speed + "×"; };
const press = (on, off, v) => { $(on).setAttribute("aria-pressed", v); $(off).setAttribute("aria-pressed", !v); };
$("#m-graph").onclick = () => { press("#m-graph", "#m-prompt", true); S.mem = "graph"; goto(S.day); };
$("#m-prompt").onclick = () => { press("#m-graph", "#m-prompt", false); S.mem = "prompt"; goto(S.day); };
function setSet(k) {
  stop(); S.set = k; press("#d-real", "#d-scale", k === "real");
  S.open = k === "real" ? "A15" : null; $("#dossier").hidden = true;
  $("#tagline").textContent = k === "real" ? "16 keepers · 5 liars · real run hard16, seed 0" : "64 keepers · 9 liars · stand-in data";
  $("#foot").textContent = k === "real" ? "Every message, thought and belief is from the run logs (graph-memory and B3o prompt-only), runs/hard16 seed 0." : "64 keepers: a seeded stand-in simulation with the game's rules, not a model run.";
  S.shown = { lies: 0, cuts: 0, burnt: 0, saved: 0 };
  buildMap(); goto(k === "real" ? 1 : 9);
}
$("#d-real").onclick = () => setSet("real");
$("#d-scale").onclick = () => setSet("scale");
$("#reveal").onchange = e => { S.reveal = e.target.checked; drawNodes(S.day); if (S.open) renderDossier(false); };
$("#map").addEventListener("click", () => S.open && closeDossier());
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape" && S.open) closeDossier();
  if (e.key === " " && e.target === document.body) { e.preventDefault(); play(); }
  if (e.key === "ArrowRight") { stop(); goto(S.day + 1); } if (e.key === "ArrowLeft") { stop(); goto(S.day - 1); }
});

// ================= embers (ambient, scales with fire) =================
(function embers() {
  const cv = $("#embers"), ctx = cv.getContext("2d"); if (!ctx) return;
  let parts = [], w = 0, h = 0;
  const size = () => { const r = cv.getBoundingClientRect(); w = cv.width = r.width * devicePixelRatio; h = cv.height = r.height * devicePixelRatio; };
  size(); addEventListener("resize", size);
  function tick() {
    const burning = Object.values(world(Math.max(0, S.day)).st).filter(x => x === "burning").length;
    const target = Math.min(140, 18 + burning * (big() ? 18 : 3));
    while (parts.length < target) parts.push({ x: Math.random() * w, y: h + Math.random() * h * .3, v: .3 + Math.random() * .9, r: (.6 + Math.random() * 1.6) * devicePixelRatio, a: .2 + Math.random() * .5, s: Math.random() * 6 });
    ctx.clearRect(0, 0, w, h);
    parts.forEach(p => { p.y -= p.v * devicePixelRatio; p.x += Math.sin((p.y + p.s * 100) / 60) * .4; p.a -= .0015;
      ctx.fillStyle = `rgba(255,${140 + (p.s * 15 | 0)},60,${Math.max(0, p.a)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); });
    parts = parts.filter(p => p.y > -10 && p.a > 0).slice(0, target);
    requestAnimationFrame(tick);
  }
  if (!REDUCED) requestAnimationFrame(tick);
})();

setSet("real");
</script>
