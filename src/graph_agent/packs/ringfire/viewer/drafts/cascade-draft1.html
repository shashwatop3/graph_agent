<title>Cascade Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: agent network (who told whom) + separate real-world panel, with a day scrubber and activity strip.
   Views switch to dense forms when a run is large (many agents, days, fields). */
:root {
  --bg: #eef1f3; --panel: #fbfcfc; --ink: #141b24; --muted: #5b6676; --line: #d5dbe2; --soft: #e4e9ee;
  --accent: #3346c8; --fire: #e2550f; --burnt: #5e4a42; --alive: #cfe2d1; --water: #0a86b0;
  --lie: #c21f73; --stale: #c62828; --ok: #2e7d43; --on-dark: #f6f3f1;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1219; --panel: #141b25; --ink: #e4e9ef; --muted: #8d99a8; --line: #263142; --soft: #1b2430;
  --accent: #8c9bff; --fire: #ff7a3a; --burnt: #8a766c; --alive: #22402b; --water: #3cb8e0;
  --lie: #ff5fa8; --stale: #ff6363; --ok: #5fcf7d; --on-dark: #141b25; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1219; --panel: #141b25; --ink: #e4e9ef; --muted: #8d99a8; --line: #263142; --soft: #1b2430;
  --accent: #8c9bff; --fire: #ff7a3a; --burnt: #8a766c; --alive: #22402b; --water: #3cb8e0;
  --lie: #ff5fa8; --stale: #ff6363; --ok: #5fcf7d; --on-dark: #141b25; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
.wrap { padding: 16px; padding-block: 16px 28px; display: grid; gap: 14px; max-width: 1400px; margin: 0 auto; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand h1 { font-size: 26px; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 11px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.search { font: inherit; font-family: var(--f-mono); font-size: 12.5px; width: 9ch; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

/* timeline */
.tl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 8px; }
.tl-row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.btn { height: 32px; min-width: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); font-size: 13px; white-space: nowrap; }
.daylabel { font-family: var(--f-display); font-weight: 700; font-size: 20px; min-width: 6ch; font-variant-numeric: tabular-nums; }
.caption { flex: 1 1 280px; min-width: 0; font-size: 13.5px; }
#strip { cursor: pointer; }
.strip-key { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.strip-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }

.main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.ph { padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
.ph h2 { font-size: 18px; }
.pb { padding: 10px 16px 16px; }

.net { position: relative; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--f-mono); }
.node { cursor: pointer; }
.node:hover .disc { stroke-width: 3; }
.counter { position: absolute; top: 12px; left: 14px; display: grid; gap: 2px; pointer-events: none; }
.counter .n { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.counter .l { font-size: 12px; color: var(--muted); max-width: 18ch; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); padding: 0 16px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; }
.legend i.o { width: 12px; height: 12px; border-radius: 50%; background: transparent; border: 1.5px solid var(--c); }
.legend i.o.d { border-style: dashed; }

.card { position: absolute; width: min(340px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 14px 40px -12px rgb(10 15 25 / .35); padding: 12px 14px; display: grid; gap: 10px; max-height: 78%; overflow: auto; z-index: 5; }
.card-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-h .name { font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.card-h .x { margin-left: auto; border: 0; background: var(--soft); width: 28px; height: 28px; border-radius: 50%; }
.tag { font-family: var(--f-mono); font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--c, var(--line)); color: var(--c, var(--muted)); white-space: nowrap; }
.sec { display: grid; gap: 6px; }
.bub { border-radius: 10px; padding: 6px 10px; background: var(--soft); font-size: 13px; line-height: 1.4; }
.bub.out { background: color-mix(in srgb, var(--accent) 13%, var(--panel)); }
.bub.false { box-shadow: inset 0 0 0 1.5px var(--lie); }
.bub small { display: block; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.thought { font-style: italic; line-height: 1.5; font-size: 13px; border-left: 3px solid var(--line); padding-left: 10px; }
.bl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.bl li { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; }
.bl li.stale > span:first-child { text-decoration: line-through; color: var(--muted); }
.none { color: var(--muted); font-size: 12.5px; margin: 0; }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details > div, details > ul { margin-top: 6px; display: grid; gap: 6px; }
details ul { padding-left: 16px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
@media (max-width: 600px) { .card { position: fixed; left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; max-height: 70vh; } }

/* world */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.stat { border-radius: 8px; padding: 6px 8px; background: var(--soft); min-width: 0; }
.stat .n { font-family: var(--f-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.stat .l i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); display: inline-block; flex: none; }
.wtools { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.fields { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin-top: 8px; }
.f { border-radius: 8px; padding: 6px 8px; background: var(--alive); display: grid; gap: 2px; position: relative; min-width: 0; }
.f b { font-family: var(--f-mono); font-size: 12.5px; }
.f .own { font-family: var(--f-mono); font-size: 10.5px; opacity: .75; }
.f.burning { background: var(--fire); color: #fff; }
.f.burnt { background: var(--burnt); color: #f3ece8; }
.f.saved { box-shadow: inset 0 0 0 2px var(--water); }
.f.watered::after { content: "watered"; position: absolute; top: 6px; right: 7px; font-family: var(--f-mono); font-size: 9px; color: var(--water); font-weight: 600; }
.f.burning.watered::after { color: #fff; }
.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
/* dense world: one block per owner, its fields as small cells */
.blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; margin-top: 8px; }
.blk { border-radius: 6px; padding: 3px; background: var(--soft); display: grid; gap: 2px; cursor: pointer; border: 0; text-align: left; }
.blk .cells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
.blk .c { aspect-ratio: 1; border-radius: 2px; background: var(--alive); max-width: 100%; }
.blk .c.burning { background: var(--fire); } .blk .c.burnt { background: var(--burnt); }
.blk .c.saved { background: var(--water); } .blk .c.watered { box-shadow: inset 0 0 0 2px var(--water); }
.blk .t { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); text-align: center; }
.blk.hot .t { color: var(--ink); font-weight: 600; }
.note { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Cascade</h1><p id="sub"></p></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Dataset">
        <button id="d-real" aria-pressed="true">Real run · 16</button>
        <button id="d-scale" aria-pressed="false">Scale preview · 64</button>
      </div>
      <div class="seg" role="group" aria-label="Agent memory">
        <button id="m-graph" aria-pressed="true">Graph memory</button>
        <button id="m-prompt" aria-pressed="false">Prompt only</button>
      </div>
      <input class="search" id="search" placeholder="A12" aria-label="Find agent" list="agents"><datalist id="agents"></datalist>
      <label class="check"><input type="checkbox" id="reveal"> Reveal imposters</label>
    </div>
  </header>

  <section class="tl" aria-label="Timeline">
    <div class="tl-row">
      <button class="btn" id="prev" aria-label="Previous day">◂</button>
      <button class="btn" id="play" aria-label="Play">▶</button>
      <button class="btn" id="next" aria-label="Next day">▸</button>
      <span class="daylabel" id="daylabel"></span>
      <button class="btn" id="nextcut">Next trust cut ▸</button>
      <button class="btn" id="nextlie">Next relayed lie ▸</button>
      <span class="caption" id="caption"></span>
    </div>
    <svg id="strip" height="54" preserveAspectRatio="none" role="img" aria-label="Activity per day; click to jump"></svg>
    <div class="strip-key"><span><i style="--c:var(--fire)"></i>fields on fire</span><span><i style="--c:var(--lie)"></i>lies sent</span><span><i style="--c:var(--stale)"></i>trust cuts</span><span><i style="--c:var(--accent)"></i>true reports</span></div>
  </section>

  <div class="main">
    <section class="panel">
      <div class="ph"><div><div class="eyebrow">What the agents tell each other</div><h2>Agent network</h2></div><span class="eyebrow" id="net-hint">click an agent</span></div>
      <div class="net" id="net">
        <svg id="svg" viewBox="0 0 600 600" role="img" aria-label="Agents and the messages they send"></svg>
        <div class="counter" id="counter"></div>
        <div class="card" id="card" hidden></div>
      </div>
      <div class="legend">
        <span><i style="--c:var(--accent)"></i>true report</span>
        <span><i style="--c:var(--lie)"></i>false report</span>
        <span><i style="--c:var(--stale)"></i>trust cut</span>
        <span><i class="o" style="--c:var(--ink)"></i>agent</span>
        <span><i class="o d" style="--c:var(--lie)"></i>imposter (revealed)</span>
      </div>
    </section>

    <section class="panel">
      <div class="ph"><div><div class="eyebrow">Ground truth · agents never see this</div><h2>Real world</h2></div><span class="eyebrow" id="w-day"></span></div>
      <div class="pb">
        <div class="stats" id="wstats"></div>
        <div class="wtools"><span class="eyebrow" id="w-sub"></span><label class="check" id="w-filter-l"><input type="checkbox" id="w-filter"> Only fields touched by fire</label></div>
        <div id="world"></div>
        <p class="note" id="w-note"></p>
      </div>
    </section>
  </div>
</div>

// ================= agent card =================
function openCard(id) { state.open = id; drawNet(); drawWorld(); renderCard(); }
function closeCard() { state.open = null; $("#card").hidden = true; drawNet(); drawWorld(); }
function bubble(m, dir) {

// ================= real world =================
function worldAt(day) {
  const r = run(), st = {};
  for (let d = 0; d <= day; d++) {

    r.days[d].out.forEach(f => st[f] = "burnt");

}
function drawWorld() {

  $("#wstats").innerHTML = [["alive", "var(--alive)", c.alive + c.saved], ["on fire", "var(--fire)", c.burning], ["burnt", "var(--burnt)", c.burnt], ["saved by water", "var(--water)", c.saved]]
    .map(([l, col, v]) => `<div class="stat"><div class="n">${v}</div><div class="l"><i style="--c:${col}"></i>${l}</div></div>`).join("");
  $("#w-day").textContent = `end of day ${state.day}`;
  const label = { alive: "alive", burning: "on fire", burnt: "burnt", saved: "saved" };
  if (!dense()) {
    $("#w-filter-l").hidden = true; $("#w-sub").textContent = `${F} fields`;
    let tiles = "";
    for (let f = 0; f < F; f++) {
      const s = st[f] || "alive", o = Math.floor(f / fpa), owner = A(o);
      tiles += `<div class="f ${s} ${watered.has(o) ? "watered" : ""} ${state.open === owner ? "sel" : ""}" title="F${f}, owned by ${owner}: ${label[s]}"><b>F${f}</b><span class="own">${owner} · ${label[s]}</span></div>`;
    }
    $("#world").innerHTML = `<div class="fields">${tiles}</div>`;
    $("#w-note").textContent = "Each tag names the agent that owns the field. Fire spreads clockwise. A field watered on the day fire arrives is saved.";
    return;
  }
  $("#w-filter-l").hidden = false; $("#w-sub").textContent = `${F} fields · one block per agent`;
  let html = "";
  for (let o = 0; o < n; o++) {
    const cells = Array.from({ length: fpa }, (_, k) => o * fpa + k), hot = cells.some(f => st[f]);
    if (state.filter && !hot && state.open !== A(o)) continue;
    html += `<button class="blk ${hot ? "hot" : ""} ${state.open === A(o) ? "sel" : ""}" data-a="${A(o)}" title="${A(o)}: ${cells.map(f => `F${f} ${label[st[f] || "alive"]}`).join(", ")}${watered.has(o) ? " · watered today" : ""}">
      <span class="cells">${cells.map(f => `<span class="c ${st[f] || ""} ${watered.has(o) && !st[f] ? "watered" : ""}"></span>`).join("")}</span><span class="t">${A(o)}</span></button>`;
  }

// ================= controls =================

const jump = pred => { stop(); for (let d = state.day + 1; d < ds().D; d++) if (pred(d)) return setDay(d); };
$("#nextcut").onclick = () => jump(d => run().expo.some(e => e[0] === d));
$("#nextlie").onclick = () => jump(d => run().msgs.some(m => m[0] === d && m[6] && !ds().imp.has(m[1])));
$("#strip").addEventListener("click", e => { const b = $("#strip").getBoundingClientRect(); stop(); setDay(Math.floor((e.clientX - b.left) / b.width * ds().D)); });
const press = (a, b, on) => { $(a).setAttribute("aria-pressed", on); $(b).setAttribute("aria-pressed", !on); };
function setSet(k) {
  stop(); state.set = k; if (k === "scale" && !SETS.scale) SETS.scale = scaleDataset();
  press("#d-real", "#d-scale", k === "real");
  state.day = k === "real" ? 1 : 9; state.open = k === "real" ? "A15" : null;
  $("#sub").textContent = ds().sub;
  $("#agents").innerHTML = Array.from({ length: ds().n }, (_, i) => `<option value="A${i}">`).join("");
  render();
}
$("#d-real").onclick = () => setSet("real");
$("#d-scale").onclick = () => setSet("scale");
$("#m-graph").onclick = () => { state.mem = "graph"; press("#m-graph", "#m-prompt", true); render(); };
$("#m-prompt").onclick = () => { state.mem = "prompt"; press("#m-graph", "#m-prompt", false); render(); };
$("#reveal").onchange = e => { state.reveal = e.target.checked; render(); };
$("#w-filter").onchange = e => { state.filter = e.target.checked; drawWorld(); };
$("#search").addEventListener("change", e => { const v = e.target.value.trim().toUpperCase().replace(/^(\d)/, "A$1"); if (/^A\d+$/.test(v) && num(v) < ds().n) openCard(v); e.target.value = ""; });
$("#svg").addEventListener("click", () => state.open && closeCard());
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.open) closeCard();
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); setDay(state.day + 1); } if (e.key === "ArrowLeft") { stop(); setDay(state.day - 1); }
});
addEventListener("resize", () => state.open && renderCard());
setSet(location.hash === "#scale" ? "scale" : "real");
</script>
