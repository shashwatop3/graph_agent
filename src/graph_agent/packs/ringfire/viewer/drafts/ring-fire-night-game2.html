<title>Ring Fire Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
/* Layout: a quiet night-map game screen. The ring of beacons fills the stage; the day numeral lives in the
   ring's empty centre. Truth map and dispatch sit in a hairline-ruled column, the turn track underneath.
   One deliberate dark world. Nothing is rebuilt between frames: elements persist and change state. */
:root {
  --bg: #0b0e14; --bg2: #10141d; --hair: rgb(255 255 255 / .08); --hair2: rgb(255 255 255 / .14);
  --ink: #e9e5db; --dim: #8b909d; --faint: #4a5061;
  --ember: #ff8a3d; --flame: #ffc46b; --char: #2c2522; --grass: #17261f; --water: #5ccfe6;
  --lie: #ff5c9a; --truth: #9ab8ff; --cut: #ff5050; --gold: #e8c37a;
  --f-display: "Instrument Serif", Georgia, serif;
  --f-ui: "Geist", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.22, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
.app { padding: 16px; padding-block: 18px 22px; max-width: 1480px; margin: 0 auto; display: grid; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.caps { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; padding-bottom: 12px; border-bottom: 1px solid var(--hair); }
.title { display: grid; gap: 2px; }
.title h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: .9; letter-spacing: -.01em; }
.title h1 em { color: var(--flame); }
.stats { display: flex; gap: 26px; flex-wrap: wrap; }
.stat { display: grid; gap: 1px; min-width: 64px; }
.stat .v { font-family: var(--f-display); font-style: italic; font-size: 32px; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
.opts { margin-left: auto; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.toggle { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid var(--hair2); }
.toggle button { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; color: var(--dim); transition: color .3s var(--ease), background .3s var(--ease); white-space: nowrap; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chk { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--dim); cursor: pointer; }
.chk input { accent-color: var(--lie); }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 28px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; aspect-ratio: 1; width: 100%; max-height: 80vh; margin-inline: auto; }
.stage > canvas, .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
svg text { font-family: var(--f-mono); }
.centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 46%; }
.centre .night { display: block; }
.numwrap { height: 120px; overflow: hidden; position: relative; }
.num { font-family: var(--f-display); font-style: italic; font-size: 120px; line-height: 120px; display: block; }
.centre .cap { font-size: 13px; line-height: 1.45; color: var(--dim); margin-top: 6px; text-wrap: balance; }
.hint { position: absolute; left: 0; bottom: 0; }
.play-big { position: absolute; left: 50%; top: calc(50% + 120px); transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; border: 1px solid var(--hair2); font-size: 13px; color: var(--ink); transition: border-color .3s var(--ease), background .3s var(--ease); white-space: nowrap; }
.play-big:hover { border-color: var(--flame); background: rgb(255 196 107 / .06); }

/* beacons */
.beacon { cursor: pointer; }
.beacon .ring { fill: var(--bg); stroke: var(--faint); stroke-width: 1.2; transition: stroke .5s var(--ease); }
.beacon .core { fill: var(--faint); transition: fill .5s var(--ease); }
.beacon .halo { fill: var(--flame); opacity: 0; transition: opacity .6s var(--ease); }
.beacon.lit .core { fill: var(--flame); }
.beacon.lit .halo { opacity: .07; }
.beacon.liar .ring { stroke: var(--lie); stroke-dasharray: 2.5 2.5; }
.beacon:hover .ring { stroke: var(--ink); }
.beacon .lbl { fill: var(--dim); transition: fill .3s var(--ease); }
.beacon.sel .lbl { fill: var(--gold); }
.beacon.liar .lbl { fill: var(--lie); }
.selring { fill: none; stroke: var(--gold); stroke-width: 1; opacity: 0; transition: opacity .4s var(--ease); }
.beacon.sel .selring { opacity: 1; }
.link { stroke: var(--hair2); stroke-width: 1; transition: stroke .6s var(--ease), stroke-dasharray .6s; fill: none; }
.link.cut { stroke: var(--cut); stroke-dasharray: 3 4; }
.cutmark { stroke: var(--cut); stroke-width: 1.6; stroke-linecap: round; opacity: 0; transition: opacity .5s var(--ease); }
.cutmark.on { opacity: 1; }
.trail { fill: none; stroke-linecap: round; }

/* side */
.side { display: grid; gap: 22px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); margin-bottom: 10px; }
.sec-h h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.wcount { display: flex; gap: 18px; margin-bottom: 10px; flex-wrap: wrap; }
.wcount span { font-size: 12.5px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
.wcount b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.wcount i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); display: inline-block; }
.tiles { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
.tile { aspect-ratio: 1.1; border-radius: 3px; background: var(--grass); position: relative; display: grid; place-items: center; transition: background-color .7s var(--ease), box-shadow .7s var(--ease), transform .5s var(--ease); }
.tile span { font-family: var(--f-mono); font-size: 9px; color: rgb(233 229 219 / .55); line-height: 1.1; text-align: center; }
.tile span b { display: block; font-weight: 500; color: rgb(233 229 219 / .85); font-size: 9.5px; }
.tile.burning { background: var(--ember); box-shadow: 0 0 14px -3px var(--ember); }
.tile.burning span, .tile.burning span b { color: #2a1206; }
.tile.burnt { background: var(--char); }
.tile.saved { background: #12333c; box-shadow: inset 0 0 0 1px var(--water); }
.tile.mine { box-shadow: inset 0 0 0 1px var(--gold); }
.tile.watered::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 2px; height: 2px; border-radius: 1px; background: var(--water); }
.tiles.dense { grid-template-columns: 26px repeat(16, minmax(0, 1fr)); gap: 2px; align-items: center; }
.rowlab { font-family: var(--f-mono); font-size: 8.5px; color: var(--faint); }
.tiles.dense .tile { aspect-ratio: 1; border-radius: 2px; }
.tiles.dense .tile span { display: none; }
.log { list-style: none; margin: 0; padding: 0; display: grid; max-height: 248px; overflow: hidden; font-size: 12.5px; }
.log li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--hair); }
.log .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; color: var(--c); padding-top: 2px; }
.log .r { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); }

/* dossier */
.dossier { position: absolute; top: 2%; right: 0; width: min(330px, 92%); max-height: 96%; overflow: auto; z-index: 4;
  background: rgb(16 20 29 / .86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--hair2); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.d-h { display: flex; align-items: baseline; gap: 10px; }
.d-h .nm { font-family: var(--f-display); font-size: 38px; line-height: .9; }
.d-h .x { margin-left: auto; color: var(--dim); font-size: 18px; width: 28px; height: 28px; border-radius: 50%; }
.d-h .x:hover { color: var(--ink); background: var(--hair); }
.d-sec { display: grid; gap: 6px; }
.msg { font-size: 13px; line-height: 1.45; padding-left: 10px; border-left: 1px solid var(--hair2); }
.msg.lie { border-left-color: var(--lie); }
.msg small { display: block; font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); }
.thought { font-family: var(--f-display); font-style: italic; font-size: 19px; line-height: 1.35; color: var(--ink); }
.thought .caret { display: inline-block; width: 1px; height: 1em; background: var(--flame); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.bl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.bl li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.bl li.dead > span:first-child { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--cut); }
.st { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.none { color: var(--dim); font-size: 12.5px; margin: 0; }
details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
details > div { display: grid; gap: 6px; margin-top: 6px; }
@media (max-width: 640px) { .dossier { position: fixed; inset: auto 8px 8px 8px; width: auto; max-height: 70vh; } .centre .numwrap { height: 80px; } .num { font-size: 80px; line-height: 80px; } .play-big { top: calc(50% + 80px); } }

/* track */
.track { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--hair); }
.tb { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair2); display: grid; place-items: center; font-size: 12px; transition: border-color .3s var(--ease); }
.tb:hover { border-color: var(--ink); }
.tb:disabled { opacity: .35; cursor: default; }
.pips { position: relative; flex: 1 1 320px; max-width: calc(var(--n, 40) * 34px); min-width: 0; height: 36px; display: flex; gap: 2px; align-items: flex-end; }
.pip { flex: 1; min-width: 3px; height: var(--h); border-radius: 2px 2px 0 0; background: var(--hair2); position: relative; transition: background .4s var(--ease); }
.pip::after { content: ""; position: absolute; left: 0; top: -4px; height: 2px; width: var(--l); background: var(--lie); border-radius: 1px; }
.pip.past { background: rgb(255 255 255 / .22); }
.pip.now { background: var(--flame); }
.cursor { position: absolute; top: -6px; width: 1px; height: calc(100% + 10px); background: var(--flame); pointer-events: none; }
.spd { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--hair2); }
.foot { font-size: 11.5px; color: var(--faint); }
</style>

<div class="app">
  <header class="bar">
    <div class="title"><span class="caps" id="tag"></span><h1>Ring Fire, <em>at night</em></h1></div>
    <div class="stats" id="stats"></div>
    <div class="opts">
      <div class="toggle" role="group" aria-label="Agent memory"><button id="m-graph" aria-pressed="true">Graph mind</button><button id="m-prompt" aria-pressed="false">Prompt mind</button></div>
      <div class="toggle" role="group" aria-label="Map size"><button id="d-real" aria-pressed="true">16</button><button id="d-scale" aria-pressed="false">64</button></div>
      <label class="chk"><input type="checkbox" id="reveal"> Reveal liars</label>
    </div>
  </header>

  <div class="main">
    <section class="stage" id="stage" aria-label="Night map">
      <canvas id="embers" aria-hidden="true"></canvas>
      <svg id="map" viewBox="0 0 640 640" role="img" aria-label="Agents as beacons and the messages between them"></svg>
      <div class="centre"><span class="caps night">Night</span><div class="numwrap"><span class="num" id="num">1</span></div><div class="cap" id="cap"></div></div>
      <button class="play-big" id="start">Play the night ▸</button>
      <span class="caps hint">Click a beacon</span>
      <div class="dossier" id="dossier" hidden></div>
    </section>

    <aside class="side">
      <section>
        <div class="sec-h"><h2>Truth</h2><span class="caps">agents can't see this</span></div>
        <div class="wcount" id="wcount"></div>
        <div id="tiles"></div>
      </section>
      <section>
        <div class="sec-h"><h2>Dispatch</h2><span class="caps" id="logday"></span></div>
        <ul class="log" id="log"></ul>
      </section>
    </aside>
  </div>

  <footer class="track" aria-label="Turn track">
    <button class="tb" id="prev" aria-label="Previous night">◂</button>
    <button class="tb" id="play" aria-label="Play">▶</button>
    <button class="tb" id="next" aria-label="Next night">▸</button>
    <div class="pips" id="pips"></div>
    <button class="spd" id="speed">1×</button>
  </footer>
  <p class="foot" id="foot"></p>
</div>

  let h = `<div class="d-h"><span class="nm">${id}</span><span class="caps">keeper of F${i * fpa}${fpa > 2 ? "–" : ", "}F${i * fpa + fpa - 1}${S.reveal && ds().imp.has(i) ? ' · <span style="color:var(--lie)">liar</span>' : ""}</span><button class="x" id="x" aria-label="Close">×</button></div>`;
  h += `<div class="d-sec"><span class="caps">Thinks · night ${d}</span><div class="thought" id="thought">${t ? "" : '<span class="none" style="font-family:var(--f-ui);font-style:normal">Silent tonight.</span>'}</div></div>`;
  h += `<div class="d-sec"><span class="caps">Heard</span>${capped(heard, m => msgLine(m, "in"))}</div>`;
  h += `<div class="d-sec"><span class="caps">Said</span>${capped(said, m => msgLine(m, "out"))}</div>`;
  if (S.mem === "graph") {
    let rows = [];
    if (ds().beliefs) rows = (ds().beliefs[id] || []).filter(b => b[3] <= d).map(b => { const dead = b[4] !== null && b[4] <= d; return [dead, `F${b[1]} burns day ${b[2]}`, dead ? ["dropped", "var(--cut)"] : b[5] === "forecast" ? ["forecast", "var(--dim)"] : ["holds", "var(--truth)"], b[6] ? `via ${b[6]}` : b[5]]; });
    else {
      const cut = new Set(cutsUpTo(d).filter(e => e[1] === id).map(e => num(e[2]))), by = new Map();
      run().msgs.filter(m => m[0] <= d && A(m[2]) === id).forEach(m => { const k = m[4] + "|" + m[5], b = by.get(k) || { f: m[4], c: m[5], r: [] }; b.r.push(m[3]); by.set(k, b); });
      rows = [...by.values()].map(b => { const live = b.r.filter(r => !r.some(x => cut.has(x))).length; return [!live, `F${b.f} burns day ${b.c}`, live ? ["holds", "var(--truth)"] : ["dropped", "var(--cut)"], `${live}/${b.r.length} routes`]; }).sort((a, b) => b[0] - a[0]);
    }
    const row = r => `<li class="${r[0] ? "dead" : ""}"><span>${r[1]} <small style="color:var(--dim)">${r[3]}</small></span><span class="st" style="--c:${r[2][1]}">${r[2][0]}</span></li>`;
    h += `<div class="d-sec"><span class="caps">Memory graph</span>${rows.length ? `<ul class="bl">${rows.slice(0, 5).map(row).join("")}</ul>${rows.length > 5 ? `<details><summary>${rows.length - 5} more</summary><div><ul class="bl">${rows.slice(5).map(row).join("")}</ul></div></details>` : ""}` : '<p class="none">Empty so far.</p>'}</div>`;
    if (cuts.length) h += `<div class="d-sec"><span class="caps">Distrusts</span><p class="none" style="color:var(--cut)">${cuts.join(", ")}, caught lying by the evidence.</p></div>`;
  } else h += `<div class="d-sec"><span class="caps">Memory</span><p class="none">No memory graph. A prompt mind re-reads the whole chat log every night and keeps nothing structured.</p></div>`;
  const wasHidden = box.hidden;
  box.innerHTML = h; box.hidden = false; $("#x").onclick = closeDossier;
  if (t) {
    const text = `“${t.final || "…"}”`, el_ = $("#thought");
    if (AN && fresh) { const o = { n: 0 }; el_.innerHTML = '<span></span><i class="caret"></i>'; const sp = el_.firstChild;
      AN({ targets: o, n: text.length, duration: Math.min(2400, text.length * 16), easing: "linear", update: () => sp.textContent = text.slice(0, o.n | 0) }); }
    else el_.textContent = text;
  }
  if (AN && wasHidden) AN({ targets: box, opacity: [0, 1], translateY: [10, 0], duration: 420, easing: "easeOutQuart" });
}

// ---------------- track ----------------
function buildTrack() {
  const D = ds().D, r = run(), mx = Math.max(1, ...Array.from({ length: D }, (_, d) => r.msgs.filter(m => m[0] === d).length));
  $("#pips").style.setProperty("--n", D);
  $("#pips").innerHTML = Array.from({ length: D }, (_, d) => { const ms = r.msgs.filter(m => m[0] === d), l = ms.filter(m => m[6]).length;
    return `<button class="pip" data-d="${d}" aria-label="Night ${d}" style="--h:${22 + 78 * ms.length / mx}%;--l:${ms.length ? l / ms.length * 100 : 0}%"></button>`; }).join("") + `<span class="cursor" id="cursor"></span>`;
  document.querySelectorAll(".pip").forEach(p => p.onclick = () => { stop(); go(+p.dataset.d); });
}
function applyTrack() {
  document.querySelectorAll(".pip").forEach((p, d) => { p.classList.toggle("past", d < S.day); p.classList.toggle("now", d === S.day); });
  const pip = document.querySelectorAll(".pip")[S.day], cur = $("#cursor");
  if (pip && cur) { const x = pip.offsetLeft + pip.offsetWidth / 2; if (AN) AN({ targets: cur, left: x, duration: 500, easing: "easeOutQuart" }); else cur.style.left = x + "px"; }
  $("#prev").disabled = S.day === 0; $("#next").disabled = S.day >= ds().D - 1;
}

// ---------------- control ----------------
function go(d) { S.token++; S.day = Math.max(0, Math.min(ds().D - 1, d)); G.fx.innerHTML = ""; settle(S.day); }
function stop() { if (!S.playing) return; S.playing = false; S.token++; $("#play").textContent = "▶"; $("#start").hidden = false; settle(S.day); }
async function play(fromStart) {
  if (S.playing) return stop();
  S.playing = true; $("#play").textContent = "❚❚"; $("#start").hidden = true;
  let d = fromStart || S.day >= ds().D - 1 ? 0 : S.day + 1;
  if (fromStart) { S.token++; G.fx.innerHTML = ""; applyLinks(-1); applyWorld(0); applyStats(-1, false); S.shown = { lies: 0, cuts: 0, lost: 0, saved: 0 }; }
  while (S.playing && d < ds().D) { const tok = ++S.token; await playNight(d, tok); if (tok !== S.token) return; d++; }
  S.playing = false; $("#play").textContent = "▶"; $("#start").hidden = false;
}
$("#play").onclick = () => play(false);
$("#start").onclick = () => play(true);
$("#prev").onclick = () => { stop(); go(S.day - 1); };
$("#next").onclick = async () => { if (S.playing) stop(); if (S.day < ds().D - 1) { const tok = ++S.token; G.fx.innerHTML = ""; await playNight(S.day + 1, tok); if (tok === S.token) settle(S.day); } };
$("#speed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $("#speed").textContent = S.speed + "×"; };
const press = (a, b, v) => { $(a).setAttribute("aria-pressed", v); $(b).setAttribute("aria-pressed", !v); };
$("#m-graph").onclick = () => { stop(); press("#m-graph", "#m-prompt", true); S.mem = "graph"; buildTrack(); go(S.day); };
$("#m-prompt").onclick = () => { stop(); press("#m-graph", "#m-prompt", false); S.mem = "prompt"; buildTrack(); go(S.day); };
function setSet(k) {
  stop(); S.set = k; press("#d-real", "#d-scale", k === "real"); S.open = k === "real" ? "A15" : null; $("#dossier").hidden = true;
  $("#tag").textContent = k === "real" ? "16 keepers · 5 liars · real run" : "64 keepers · 9 liars · stand-in data";
  $("#foot").textContent = k === "real" ? "Every message, thought and belief comes from the run logs: runs/hard16, seed 0, graph-memory and B3o prompt-only." : "64 keepers is a seeded stand-in simulation with the game's rules, not a model run.";
  build(); go(k === "real" ? 1 : 9);
}
$("#d-real").onclick = () => setSet("real");
$("#d-scale").onclick = () => setSet("scale");
$("#reveal").onchange = e => { S.reveal = e.target.checked; applyNodes(S.day); if (S.open) renderDossier(false); };
$("#map").addEventListener("click", () => S.open && closeDossier());
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape" && S.open) closeDossier();
  if (e.key === "ArrowRight") { stop(); go(S.day + 1); }
  if (e.key === "ArrowLeft") { stop(); go(S.day - 1); }
});
addEventListener("resize", () => applyTrack());

// ---------------- embers: time-based, scales with the fire ----------------
(function embers() {
  const cv = $("#embers"), ctx = cv.getContext && cv.getContext("2d"); if (!ctx || REDUCED) return;
  let P = [], w = 0, h = 0, last = performance.now();
  const size = () => { const r = cv.getBoundingClientRect(), k = Math.min(2, devicePixelRatio || 1); w = cv.width = r.width * k; h = cv.height = r.height * k; };
  size(); addEventListener("resize", size);
  function frame(now) {
    const dt = Math.min(50, now - last) / 16.7; last = now;
    const burning = Object.values(world(S.day).st).filter(x => x === "burning").length;
    const target = Math.min(90, 10 + burning * (small() ? 14 : 2));
    if (P.length < target && Math.random() < .3 * dt) P.push({ x: w * (.15 + Math.random() * .7), y: h * (.55 + Math.random() * .5), vy: .25 + Math.random() * .45, ph: Math.random() * 6.28, r: .6 + Math.random() * 1.4, life: 1 });
    ctx.clearRect(0, 0, w, h);
    for (const p of P) {
      p.y -= p.vy * dt; p.ph += .02 * dt; p.x += Math.sin(p.ph) * .25 * dt; p.life -= .004 * dt;
      const a = Math.max(0, p.life) * .55;
      ctx.fillStyle = `rgba(255,${150 + (p.r * 30 | 0)},90,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (w / 700), 0, 6.283); ctx.fill();
    }
    P = P.filter(p => p.life > 0 && p.y > 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

setSet("real");
</script>
