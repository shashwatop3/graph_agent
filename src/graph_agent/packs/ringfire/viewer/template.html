<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Fire Replay</title>
<!-- A self-contained replay page. harness/replay.py replaces __REPLAY__ with one game's JSON.
     Left: the ring, day by day. Right: what happened that day and what each correction changed. -->
<style>
  :root {
    --bg: #f6f7f5; --surface: #ffffff; --fg: #182120; --muted: #5a6865; --line: #d4dbd8;
    --unburnt: #cfe3cf; --burning: #e8590c; --burnt: #4a3f3a; --msg: #3b6fd4; --lie: #d6246e;
    --distrust: #c92a2a; --link: #2b8a3e; --hidden: #e8890c; --water: #1c7ed6; --imposter: #862e9c;
    --stale: #c92a2a; --suspect: #e67700;
    font-family: system-ui, "Segoe UI", sans-serif; font-size: 14px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1514; --surface: #172120; --fg: #e5eeeb; --muted: #97a9a4; --line: #2c3a37;
      --unburnt: #2f4a33; --burning: #ff8a3d; --burnt: #8c7a70; --msg: #74a0ff; --lie: #ff6fa8;
      --distrust: #ff6b6b; --link: #5fd37b; --hidden: #ffb347; --water: #5aaaf0; --imposter: #c58af0;
      --stale: #ff6b6b; --suspect: #ffb347; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1514; --surface: #172120; --fg: #e5eeeb; --muted: #97a9a4; --line: #2c3a37;
    --unburnt: #2f4a33; --burning: #ff8a3d; --burnt: #8c7a70; --msg: #74a0ff; --lie: #ff6fa8;
    --distrust: #ff6b6b; --link: #5fd37b; --hidden: #ffb347; --water: #5aaaf0; --imposter: #c58af0;
    --stale: #ff6b6b; --suspect: #ffb347; color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  .page { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--fg); font-family: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  input[type=range] { flex: 1 1 200px; min-width: 120px; }
  label.toggle { color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--c); vertical-align: middle; margin-right: 5px; }
  .legend i.dot { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--c); }
  h2 { font-size: 14px; margin: 0 0 6px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 3px 0; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); white-space: nowrap; }
  .stale { --c: var(--stale); } .suspect { --c: var(--suspect); }
  .exposure { border-left: 3px solid var(--distrust); padding-left: 10px; margin: 8px 0; }
  .lie-text { color: var(--lie); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 2px 6px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Ring Fire replay <span class="sub" id="system"></span></h1>
    <div class="sub" id="summary"></div>
  </header>
  <div class="grid">
    <section class="card">
      <svg id="ring" viewBox="0 0 720 720" role="img" aria-label="The ring of agents and fields for the selected day"></svg>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card" aria-live="polite">
      <h2 id="dayTitle"></h2>
      <div id="events"></div>
    </section>
  </div>
  <div class="card controls">
    <button id="back" type="button" aria-label="Previous day">&#9664;</button>
    <button id="play" type="button">Play</button>
    <button id="next" type="button" aria-label="Next day">&#9654;</button>
    <input id="slider" type="range" min="0" value="0" aria-label="Day">
    <label class="toggle"><input id="truth" type="checkbox" checked> show imposters</label>
  </div>
  <section class="card"><h2>Score</h2><table id="score"></table></section>
</div>

<script id="replay" type="application/json">__REPLAY__</script>
<script>
(function () {
  var R = JSON.parse(document.getElementById("replay").textContent);
  var N = R.n_agents, F = R.fields.length, D = R.days.length;
  var CX = 360, CY = 360, RING = 215, LABEL = 268;

  // ---- when each field ignites and burns out ----
  var ignited = {}, burnt = {};
  R.days.forEach(function (d) {
    d.ignited.forEach(function (e) { ignited[e.field] = d.day; });
    d.burnt_out.forEach(function (f) { burnt[f] = d.day; });
  });
  function stateOf(f, day) {
    if (ignited[f] === undefined || ignited[f] > day) return "unburnt";
    if (burnt[f] !== undefined && burnt[f] <= day) return "burnt";
    return "burning";
  }

  // ---- geometry ----
  function fieldAngle(f) { return -Math.PI / 2 + 2 * Math.PI * (f + 0.5) / F; }
  function agentAngle(a) { return -Math.PI / 2 + 2 * Math.PI * (a + 0.5) / N; }
  function pt(angle, r) { return [CX + r * Math.cos(angle), CY + r * Math.sin(angle)]; }
  function fieldPt(f) { return pt(fieldAngle(f), RING); }
  function agentPt(a, r) { return pt(agentAngle(a), r || LABEL); }
  function curve(a, b, bend) {            // a curve between two points, pulled towards the centre
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    var cx = mx + (CX - mx) * bend, cy = my + (CY - my) * bend;
    return "M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + " Q" + cx.toFixed(1) + " " + cy.toFixed(1) + " " + b[0].toFixed(1) + " " + b[1].toFixed(1);
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  // ---- drawing one day ----
  function draw(index) {
    var day = R.days[index], upTo = R.days.slice(0, index + 1);
    var showTruth = document.getElementById("truth").checked;
    var out = '<defs>' +
      '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>';

    // hidden paths: faint until the fire uses one, then solid
    var revealed = {};
    upTo.forEach(function (d) { d.via_hidden.forEach(function (e) { revealed[e[0] + ">" + e[1]] = d.day; }); });
    R.edges.filter(function (e) { return e.hidden; }).forEach(function (e) {
      var used = revealed[e.src + ">" + e.dst] !== undefined;
      if (!used && !showTruth) return;
      out += '<path d="' + curve(fieldPt(e.src), fieldPt(e.dst), 0.35) + '" fill="none" stroke="var(--hidden)" stroke-width="' + (used ? 2.5 : 1.2) +
        '" stroke-dasharray="' + (used ? "0" : "3 4") + '" opacity="' + (used ? 0.95 : 0.5) + '"/>';
    });

    // shortcut links agents built
    upTo.forEach(function (d) {
      d.links_added.forEach(function (l) {
        out += '<path d="' + curve(agentPt(l[0], LABEL - 22), agentPt(l[1], LABEL - 22), 0.5) + '" fill="none" stroke="var(--link)" stroke-width="2" stroke-dasharray="6 4"/>';
      });
    });

    // trust that was withdrawn, kept on screen once it happens
    upTo.forEach(function (d) {
      d.exposures.forEach(function (e) {
        var fresh = d.day === day.day;
        out += '<path d="' + curve(agentPt(e.viewer, LABEL - 34), agentPt(e.agent, LABEL - 34), 0.2) + '" fill="none" stroke="var(--distrust)" stroke-width="' + (fresh ? 3 : 1.6) +
          '" stroke-dasharray="2 4" opacity="' + (fresh ? 1 : 0.55) + '" marker-end="url(#arr)"/>';
      });
    });

    // today's messages: normal in blue, altered by an imposter in pink
    day.messages.forEach(function (m) {
      var lie = m.altered_by.length > 0;
      out += '<path d="' + curve(agentPt(m.sender, LABEL - 12), agentPt(m.receiver, LABEL - 12), 0.55) + '" fill="none" stroke="var(--' + (lie ? "lie" : "msg") + ')" stroke-width="' + (lie ? 1.6 : 1) +
        '" opacity="' + (lie ? 0.8 : 0.4) + '" marker-end="url(#arr)"/>';
    });

    // the fields
    R.fields.forEach(function (f) {
      var p = fieldPt(f.id), st = stateOf(f.id, day.day), r = F > 24 ? 6 : 10;
      var fill = st === "burning" ? "var(--burning)" : st === "burnt" ? "var(--burnt)" : "var(--unburnt)";
      var watered = day.watered.indexOf(f.owner) >= 0;
      out += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '" fill="' + fill + '" stroke="' + (watered ? "var(--water)" : "var(--line)") + '" stroke-width="' + (watered ? 3 : 1) + '"/>';
      if (F <= 24) out += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 3.5).toFixed(1) + '" font-size="9" text-anchor="middle" fill="var(--fg)">' + f.id + '</text>';
    });

    // the agents
    for (var a = 0; a < N; a++) {
      var q = agentPt(a, LABEL + 18), isImp = R.imposters[a] !== undefined;
      out += '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + 4).toFixed(1) + '" font-size="13" font-weight="600" text-anchor="middle" fill="' +
        (isImp && showTruth ? "var(--imposter)" : "var(--fg)") + '">A' + a + '</text>';
      if (isImp && showTruth) {
        out += '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + 17).toFixed(1) + '" font-size="10" text-anchor="middle" fill="var(--imposter)">' + esc(R.imposters[a].replace("_", " ")) + '</text>';
      }
    }
    document.getElementById("ring").innerHTML = out;

    // ---- the side panel ----
    document.getElementById("dayTitle").textContent = "Day " + day.day + " of " + (D - 1);
    var lies = day.messages.filter(function (m) { return m.altered_by.length; }).length;
    var html = "<ul>";
    html += "<li>" + day.ignited.map(function (e) { return "fire reaches F" + e.field; }).join(", ") + (day.ignited.length ? "" : "no new fire") + "</li>";
    html += "<li>" + day.messages.length + " message(s)" + (lies ? ', <span class="lie-text">' + lies + " altered by an imposter</span>" : "") + "</li>";
    if (day.watered.length) html += "<li>watered: " + day.watered.map(function (a) { return "A" + a; }).join(", ") + "</li>";
    if (day.links_added.length) html += "<li>new link: " + day.links_added.map(function (l) { return "A" + l[0] + "&ndash;A" + l[1]; }).join(", ") + "</li>";
    if (day.via_hidden.length) html += "<li>fire used a hidden path: " + day.via_hidden.map(function (e) { return "F" + e[0] + " to F" + e[1]; }).join(", ") + "</li>";
    html += "</ul>";
    day.exposures.forEach(function (e) {
      html += '<div class="exposure"><strong>A' + e.viewer + ' stops trusting A' + e.agent + "</strong><div class=\"sub\">" + esc(e.reason) + "</div><ul>";
      if (!e.changes.length) html += "<li class=\"sub\">nothing it believed depended on A" + e.agent + "</li>";
      e.changes.forEach(function (c) {
        html += '<li><span class="pill ' + c.status + '">' + c.status + "</span> " + esc(c.text) + ' <span class="sub">(step ' + c.path + ")</span></li>";
      });
      html += "</ul></div>";
    });
    document.getElementById("events").innerHTML = html;
    document.getElementById("slider").value = index;
  }

  // ---- static parts ----
  document.getElementById("system").textContent = "· " + R.system;
  var s = R.score || {};
  function fmt(v) { return v === null || v === undefined ? "n/a" : (typeof v === "number" && !Number.isInteger(v) ? v.toFixed(2) : v); }
  document.getElementById("summary").textContent = N + " agents, " + F + " fields, " + D + " days, " + Object.keys(R.imposters).length + " imposter(s). Fields saved: " + fmt(s.fields_saved) + " of " + fmt(s.fields) + ".";
  var rows = [["fields saved", s.fields_saved], ["water wasted", s.water_wasted], ["messages", s.messages], ["lies passed on by honest agents", s.lies_relayed],
              ["false beliefs still held", s.false_beliefs_remaining], ["propagation precision", s.propagation_precision], ["propagation recall", s.propagation_recall],
              ["probe accuracy", s.probe_accuracy], ["tokens in", s.tokens_in]];
  document.getElementById("score").innerHTML = rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + fmt(r[1]) + "</td></tr>"; }).join("");
  document.getElementById("legend").innerHTML =
    '<span><i class="dot" style="--c:var(--unburnt)"></i>unburnt</span><span><i class="dot" style="--c:var(--burning)"></i>burning</span><span><i class="dot" style="--c:var(--burnt)"></i>burnt</span>' +
    '<span><i style="--c:var(--msg)"></i>message</span><span><i style="--c:var(--lie)"></i>altered message</span><span><i style="--c:var(--distrust)"></i>distrust</span>' +
    '<span><i style="--c:var(--link)"></i>new link</span><span><i style="--c:var(--hidden)"></i>hidden path</span><span><i style="--c:var(--water)"></i>watered</span>';

  // ---- controls ----
  var slider = document.getElementById("slider"), index = 0, timer = null;
  slider.max = Math.max(0, D - 1);
  function go(i) { index = Math.min(Math.max(i, 0), D - 1); draw(index); }
  function stop() { if (timer) { clearInterval(timer); timer = null; document.getElementById("play").textContent = "Play"; } }
  document.getElementById("back").onclick = function () { stop(); go(index - 1); };
  document.getElementById("next").onclick = function () { stop(); go(index + 1); };
  slider.oninput = function () { stop(); go(+slider.value); };
  document.getElementById("truth").onchange = function () { draw(index); };
  document.getElementById("play").onclick = function () {
    if (timer) return stop();
    if (index >= D - 1) go(0);
    document.getElementById("play").textContent = "Pause";
    timer = setInterval(function () { if (index >= D - 1) return stop(); go(index + 1); }, 900);
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { stop(); go(index + 1); }
    if (e.key === "ArrowLeft") { stop(); go(index - 1); }
  });
  go(0);
})();
</script>
</body>
</html>
